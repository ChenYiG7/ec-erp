# ec-erp Docker 部署(#28):新环境 `docker compose --profile web up -d` 即跑通全链
# 必选服务:mysql / redis / erp-api;可选 profile:oss(rustfs,#25 预留)/ web(前端 Nginx)
# 密钥注入:compose 自动读项目根 .env(模板 .env.example,.env 禁入 git)
# 生产级编排(资源限额/restart/监控/备份)不在本期范围,见计划书 §7 交接边界
name: ec-erp

services:
  mysql:
    # 执行时上 Docker Hub 核实 mysql:9.7 tag 是否存在(本项目 mapper 按 9.7.2 原生形态写,
    # 降版 MySQL 会踩 SQL 兼容红线);tag 缺失则换 mysql:9 并考虑 digest 钉版
    image: mysql:9.7
    container_name: ec-erp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在项目根 .env 中填写 MYSQL_ROOT_PASSWORD(参考 .env.example)}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动初始化唯一正本:红线——initdb 目录只允许 01_schema_init.sql,禁止塞其他迁移脚本
      # (增量 schema 一律走 add-table skill 维护正本;挂载到本机可读写可改为 :ro,初始化后可整行移除)
      - ./docs/sql/01_schema_init.sql:/docker-entrypoint-initdb.d/01_schema_init.sql:ro
    ports:
      - "3306:3306"   # 宿主机调试用;与本地 MySQL 端口冲突时改左侧或删除
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ec-erp-redis
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"   # 宿主机调试用;与本地 Redis 端口冲突时改左侧或删除
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  erp-api:
    build: .          # 国内网络可加 --build-arg MAVEN_MIRROR_URL=https://maven.aliyun.com/repository/public
    image: ec-erp/erp-api:latest
    container_name: ec-erp-api
    environment:
      TZ: Asia/Shanghai
      # 服务间走 compose 网络别名;账号密码复用 mysql 服务的 root 初始化值
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # 双密钥 fail-fast:缺失时 compose 解析即报错,不进 Java 启动栈
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:?请在项目根 .env 中填写 ERP_JWT_SECRET(≥32字节,参考 .env.example)}
      ERP_TOKEN_KEY: ${ERP_TOKEN_KEY:?请在项目根 .env 中填写 ERP_TOKEN_KEY(32字节标准base64,参考 .env.example)}
    env_file:
      # 可选键(OPENAI_*/AI_*/AMAZON_*/ERP_NOTIFY_WEBHOOK_* 等)整文件注入,缺省即功能关闭,按需在 .env 里填
      - .env
    volumes:
      # 知识库向量索引持久化(erp.ai.kb.index-path 默认 data/ai/kb-index.json,相对工作目录)
      - erp-data:/app/data
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 无 actuator 依赖,用 springdoc api-docs 端口做存活探测,不为此引 actuator
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/v3/api-docs >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # 前端(docker compose --profile web up -d 时启用):Nginx 静态托管 + /api 反代
  web:
    build: ./erp-web
    image: ec-erp/web:latest
    container_name: ec-erp-web
    profiles: ["web"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:80"     # 浏览器访问 http://localhost:8080;与本地端口冲突时改左侧
    depends_on:
      erp-api:
        condition: service_started

  # 对象存储(#25 RustFS,S3 兼容,2026-09-11 随 OSS 业务面落地收口):
  # docker compose --profile oss up -d 启用;凭证经根 .env 的 RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY
  # 覆盖(默认 rustfsadmin/rustfsadmin,仅限本地;控制台与 S3 API 同端口 9000,浏览器开 http://localhost:9000)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ec-erp-rustfs
    profiles: ["oss"]
    environment:
      TZ: Asia/Shanghai
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"   # S3 兼容 API + Web 控制台同端口

volumes:
  mysql-data:
  redis-data:
  erp-data:
  rustfs-data:
