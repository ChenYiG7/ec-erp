server:
  port: 8088

spring:
  application:
    name: ec-erp
  config:
    # 连接与密钥一律不进本文件:本地值放项目根 local.properties(已被 .gitignore 忽略,模板见 local.properties.example);
    # 键名=环境变量名,生产用真实环境变量即可整体覆盖(OS env 优先级高于配置文件)。
    # local.properties 缺失且无环境变量时占位符无法解析,启动即失败(fail-fast,与 ERP_TOKEN_KEY 同思路)
    import:
      - optional:file:./local.properties
      - optional:file:erp-api/local.properties
  datasource:
    # characterEncoding 须为 Java 字符集名(UTF-8),驱动自动协商服务端 utf8mb4;写 utf8mb4 会启动报错
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  ai:
    # OpenAI 兼容接口,按需切换 DeepSeek / 通义 / GLM:
    # 密钥/地址/模型走环境变量或 local.properties——OPENAI_BASE_URL(如 DashScope 兼容模式
    # https://dashscope.aliyuncs.com/compatible-mode/v1,官方 openai-java SDK 按 {base-url}/chat/completions 拼接)
    # + OPENAI_API_KEY + AI_MODEL;缺省回落 DeepSeek。本机环境变量已配阿里 DashScope(2026-09-07 联调实测)
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${OPENAI_API_KEY:${AI_API_KEY:}}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
      # 知识库 RAG(#6 AI 客服 V1)向量化模型:与 chat 共用 base-url/api-key(OpenAI 兼容 /embeddings);
      # DashScope 兼容模式用 text-embedding-v3/v4,DeepSeek 无 embeddings 端点(接知识库须切通义等兼容服务);
      # 无 key/调用失败时知识库接入与检索自动降级,chat 主链路不受影响
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  # 接口文档:springdoc 3.x(Boot 4 专用线);生产环境两项都置 false 关闭,SecurityConfig 已放行文档路径
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

erp:
  jwt:
    # 无默认值:本地值在 local.properties,生产用环境变量 ERP_JWT_SECRET(≥32字节,HS256)
    secret: ${ERP_JWT_SECRET}
    expire-hours: 24
  pull:
    # 拉单调度(#4):fixedDelay 间隔(上一轮结束再计时,15分钟);首次拉取(无成功游标)回溯天数(docs/04 新店铺全量近90天)
    order-interval-ms: 900000
    # listing 同步(#5):变化慢,默认 1 小时;与订单共用 first-pull-days
    product-interval-ms: 3600000
    first-pull-days: 90
  alert:
    # 库存预警扫描(#6):规则引擎在 erp-ai AlertEngine,阈值/静默期默认值见 ErpAlertProperties(yml 可覆盖);
    # 调度间隔默认 1 小时;enabled 置 false 可整体灰度关闭
    interval-ms: 3600000
    # enabled: true
    # quiet-hours: 24
    # low-stock-threshold: 10
    # ship-timeout-hours: 48
    # refund-window-hours: 24
    # refund-count-threshold: 5
  sales:
    # 销量日统计(#6 销量数据面):erp-order OrderSalesDailyService 窗口重算,默认值见 ErpSalesProperties;
    # 每日 01:00(赶在补货工作流 02:00 前出当日数据);enabled 置 false 可整体灰度关闭
    # ⚠️ 登记块至少留一个真键:空 mapping(yml 空节点)在 Boot 4 绑定器会 String→对象 ConverterNotFound 启动即炸
    enabled: true
    # cron: "0 0 1 * * ?"
    # rebuild-days: 30
  finance:
    # 退款勾稽(#19④,#12 遗留收口):aftersale_order.refund_amount 对 settlement_detail REFUND 行
    # 按订单聚合比对,差异经 #14 站内通知扇出;比对规则在 erp-finance RefundReconciliationService,
    # 编排同 #6 预警模式(erp-api RefundReconciliationJob)。每日一扫(结算报告 14 天一份,不支持高频);
    # enabled 置 false 可整体关闭(数据面未就绪时降噪)
    refund-reconciliation:
      enabled: true
      # interval-ms: 86400000        # 每日一扫(fixedDelay,上一轮结束再计时)
      # quiet-hours: 24              # 静默期(小时):同类型告警全局去重窗口(同 #6 口径)
  report:
    # 经营简报定时推送(#23 智能报表 V1,四期 BI):erp-api ReportDigestJob 按 cron 生成日/周/月报
    # 走 #14 出口扇出(pushAllUsers → 站内通知 + 邮箱 + Webhook 三渠道,后两者各自开关且默认关);
    # enabled 默认 false:经营节奏功能,部署方显式开启避免首次部署通知噪声(保护性默认同 Webhook 拍板);
    # 调度停机错过的 cron 不补发(简报漏发无损失);预览端点 GET /api/report/digest/preview 不受开关影响
    digest:
      enabled: false
      # daily-cron: "0 0 8 * * ?"        # 每日 08:00 昨日日报(销量日表 01:00 聚合后数据已就位)
      # weekly-cron: "0 30 8 ? * MON"    # 每周一 08:30 上周周报
      # monthly-cron: "0 0 9 1 * ?"      # 每月 1 日 09:00 上月月报
  ai:
    # AI 工作流参数默认值收口 ErpAiProperties(yml 可覆盖):replenish 补货 / anomaly 订单异常检测(#6);
    # 定时接线(2026-09-07 拍板):每日低峰 cron 触发(与补货错峰)+ enabled 开关,
    # 去重语义 = 同键(异常按 refId/补货按 skuId)存在待确认(status=0)建议即跳过;
    # 无 AI_API_KEY 自动降级模板/规则定级,不炸不阻断;手动触发端点不受开关/cron 影响
    replenish:
      enabled: true                  # 定时开关(erp-api ReplenishJob)
      # cron: "0 0 2 * * ?"          # 每日 02:00 低峰
      # low-stock-threshold: 10
      # scan-page-size: 100
      # scan-max-rows: 500
    anomaly:
      enabled: true                  # 定时开关(erp-api AnomalyJob)
      # cron: "0 30 2 * * ?"         # 每日 02:30 低峰(与补货错峰,共用单线程调度器)
      # big-order-amount: 10000      # 大额阈值(本位币,orderAmount×exchangeRate)
      # unpaid-hours: 48             # 未支付超时(小时,WAIT_PAY)
      # high-discount-ratio: 0.5     # 高折扣比率(已支付,discountAmount ≥ orderAmount×比率)
      # scan-page-size: 100          # 单页扫描量
      # scan-max-rows: 1000          # 单状态单轮扫描行数上限
      # llm-max-items: 20            # 单轮送 LLM 评分上限(超限按基线风险降序截断)
    purchase:
      # 采购建议(#17 三期候选,2026-09-08):补货缺口按最新采购供应商聚合为采购计划建议,
      # V1 仅手动触发(POST /api/ai/purchase/run),不接定时;输入复用补货四参数同源键(replenish.*),
      # 去重 = 同供应商存在待确认 PURCHASE 建议即跳过该组;无 AI_API_KEY 摘要自动降级模板
      scan-page-size: 100            # 单页扫描量
      # scan-max-rows: 500           # 单轮扫描行数上限
      # llm-max-items: 20            # 单轮送 LLM 摘要的供应商组上限(超限按预估金额降序截断)
    copy:
      # 文案生成(#17 三期候选「产品描述生成」,2026-09-08):为商品库启用商品批量生成 listing 文案建议
      # (标题/五点描述/商品描述/关键词),V1 仅手动触发(POST /api/ai/copywriting/run),不接定时;
      # 去重 = 同商品存在待确认 COPYWRITING 建议即跳过;文案本体即 LLM 产出无模板可兜,
      # 无 AI_API_KEY 本轮零产出(degraded=true),与补货/异常/采购的模板降级语义刻意不同
      scan-page-size: 100            # 单页扫描量
      # scan-max-rows: 200           # 单轮扫描商品数上限(文案逐商品产长文本,默认比补货收紧)
      # llm-max-items: 10            # 单轮送 LLM 生成上限(超限按 productId 升序截断,下轮再生成)
    selection:
      # 智能选品(#17 落位表「智能选品」三期提前,2026-09-08):启用商品 SKU 三维加权评分
      # (销量规模/动销趋势/毛利率,权重 sys_config 三键归一化,评分纯程序确定性可复算),
      # LLM 只写推荐理由(可降级模板);V1 仅手动触发(POST /api/ai/selection/run),不接定时;
      # 去重 = 同 SKU 存在待确认 SELECTION 建议即跳过;评分窗 30d/趋势半窗 7d 属实现细节不入配置
      scan-page-size: 100            # 单页扫描量(真键保留防 Boot 4 空 mapping 启动炸,同 kb 段口径)
      # scan-max-rows: 500           # 单轮扫描行数上限(库存行与商品页共用护栏)
      # persist-max-items: 20        # 单轮落库建议条数上限(综合分降序入选,未入选行丢弃防噪音)
      # llm-max-items: 20            # 单轮送 LLM 写理由上限(超限按综合分降序截断走模板)
    kb:
      # 知识库 RAG(#6 AI 客服 V1,2026-09-08):文档切块向量化入 SimpleVectorStore(JSON 文件持久化),
      # 检索 top-k/相似度下限入 sys_config(#18 热更);向量不入库,ai_kb_chunk 文本为重建正本。
      # ⚠️ 登记块至少留一个真键:空 mapping(yml 空节点)在 Boot 4 绑定器会 String→对象 ConverterNotFound 启动即炸
      max-file-bytes: 1048576        # 上传文件大小上限(字节)
      # index-path: data/ai/kb-index.json  # 向量索引文件路径(相对工作目录)
      # chunk-size: 800             # 切块目标 token 数(检索粒度)
      # max-document-chars: 200000  # 单文档最大字符数
      # retrieval-top-k: 4          # 检索条数默认值(sys_config erp.ai.kb.retrieval-top-k 可覆盖)
      # retrieval-min-score: 0.5    # 检索相似度下限默认值(sys_config erp.ai.kb.retrieval-min-score 可覆盖)
  shipment:
    # 发货回传平台(#11 编排,2026-09-08):确认发货事务提交后回传运单号与行级发运;
    # 置 false 则只落本地不回传(接真凭证灰度期用);adapter 未接入的店铺永远静默跳过,不产生失败噪音
    sync-enabled: true
  inventory-snapshot:
    # 库存日快照(#6 库存快照数据面,2026-09-08):每日低峰取当前存量按 (SKU, 仓) 落 snapshot;
    # 01:30 错峰(销量 01:00 之后、补货 02:00 之前);不可回溯——历史日期只取已有快照行;
    # 灰度期置 false 整体停(快照是只增不可回溯,关掉期间产生的日期数据不补)
    enabled: true
    # cron: "0 30 1 * * ?"
  adapter:
    amazon:
      # SP-API adapter(#3)默认关闭:Bean 不注册,拉单调度按"adapter 未接入"自动跳过;
      # 真凭证(Seller Central 应用授权 + LWA + IAM)就绪后置 true 并补 app-id(经 local.properties/环境变量覆盖)
      enabled: false
      lwa-base-url: https://api.amazon.com
      app-id: ${AMAZON_APP_ID:}
      # SP-API 数据面端点/签名 region:NA 站默认;EU/FE 站换端点与 region(随开站配置,docs/04)
      spapi-base-url: https://sellingpartnerapi-na.amazon.com
      spapi-region: us-east-1
      # 拉单店铺的 MarketplaceId 列表(逗号分隔,如 ATVPDKIKX0DER=US);空则拉单即报配置缺失
      marketplace-ids: ${AMAZON_MARKETPLACE_IDS:}
      # AWS 签名凭证(#3):长期 IAM 密钥走环境变量/local.properties(键=环境变量名,禁入配置文件);
      # 配置 role-arn 时经 STS AssumeRole 换临时凭证并缓存,过期前 10 分钟刷新(与 LWA 刷新节奏同口径)
      aws-access-key: ${AWS_ACCESS_KEY_ID:}
      aws-secret-key: ${AWS_SECRET_ACCESS_KEY:}
      role-arn: ${AMAZON_SPAPI_ROLE_ARN:}
      role-session-name: erp-pull
      sts-base-url: https://sts.amazonaws.com
      sts-region: us-east-1
  rate:
    # 平台 API 调用限流(#3 PlatformRateGuard):按 platform+shop+bucket 令牌桶,
    # 窗口状态持久化 Redis(Redisson RRateLimiter)防重启丢;无 Redisson Bean 时整体直通
    enabled: true
    # Redis 故障降级放行(限流是保护性横切,不绑架拉单;配额等待超时仍 fail-closed 上抛 429 由拉单重试)
    fail-open: true
    # 未显式配置的平台/桶走该保守间隔(毫秒/次)
    default-interval-ms: 2000
    amazon:
      # SP-API 拉单保守默认;真值以响应头 x-amzn-RateLimit-Limit 为准,随 #3 SigV4 实调校准
      pull-interval-ms: 2000
  notify:
    webhook:
      # Webhook 通知渠道(#14 后续渠道 V1,2026-09-08):站内通知 pushAllUsers 出口外推群机器人,
      # 三渠道 钉钉(markdown,加签)/飞书(text,加签)/企微(markdown,免签);AFTER_COMMIT 相位
      # (事务提交后才外推),失败只记日志不回滚站内通知。四键同域部署级配置不进 sys_config——
      # url/secret 凭证类(hook 地址内嵌 token,docs/07 §7 红线)走 local.properties/环境变量:
      # ERP_NOTIFY_WEBHOOK_URL / ERP_NOTIFY_WEBHOOK_SECRET;enabled 默认 false(外呼渠道保护性默认关)
      enabled: false
      # type: DINGTALK                # DINGTALK / FEISHU / WECOM(枚举,非法值启动即 fail-fast)
      # url: ${ERP_NOTIFY_WEBHOOK_URL:}
      # secret: ${ERP_NOTIFY_WEBHOOK_SECRET:}   # 钉钉(SEC 开头)/飞书 加签密钥;企微留空

logging:
  pattern:
    # traceId 由 TraceIdFilter 写入 MDC,与响应头 X-Trace-Id 同源,前端报障凭它定位整条日志
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    com.own.erp: debug
