server:
  port: 8089

spring:
  application:
    name: ec-erp-worker
  config:
    # 与 erp-api 同思路:零明文,本地值在项目根 local.properties(git-ignored),生产用同名环境变量覆盖
    import:
      - optional:file:./local.properties
      - optional:file:erp-worker/local.properties
  datasource:
    # characterEncoding 须为 Java 字符集名(UTF-8),驱动自动协商服务端 utf8mb4;写 utf8mb4 会连接报错
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
