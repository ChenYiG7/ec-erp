# ec-erp 前端 Nginx(#28):hash 路由,无需 history 回退;API 只反代不 rewrite
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip(nginx:alpine 自带 ngx_http_gzip_module,静态资源体量可观)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源带 hash 文件名,长缓存;index.html 不缓存保证发版即生效
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 主入口:仅同源 /index.html,不含任何 history rewrite
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API 反代:proxy_pass 不带 URI = 路径原样透传(前端请求以 /api 开头,后端路由含 /api 前缀)
    location /api {
        proxy_pass http://erp-api:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 流式 chat:禁缓冲保逐 token 输出,放宽读超时防长回答被掐
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        # Excel 导出响应体
        proxy_max_temp_file_size 0;
    }
}
